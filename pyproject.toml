[project]
name = "privatebin-mcp"
version = "0.1.0"
description = "MCP server for secure encrypted sharing via PrivateBin"
readme = "README.md"
authors = [
    { name = "Aaron Steers", email = "aj@airbyte.io" }
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.12.1",
    "privatebin>=0.3.0",
    "python-dotenv>=1.0.0",
]
license = { text = "MIT" }
keywords = ["mcp", "privatebin", "encryption", "sharing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/aaronsteers/privatebin-mcp"
Repository = "https://github.com/aaronsteers/privatebin-mcp"

[project.scripts]
privatebin-mcp = "privatebin_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "basedpyright>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
